<!--
  Forge plan artifact. Render it, never hand-fill it:
    python3 ~/.claude/skills/forge/scripts/render_artifact.py plan \
      --data <runDir>/plan-data.json --markdown <runDir>/plan.md --out <runDir>/plan-artifact.html
  The main session writes plan-data.json; a worker runs the renderer; the main session publishes the page.
  The renderer removes this comment, then fills every slot. It exits 1 when a slot is left unfilled.

  plan-data.json keys:
    ticket        Ticket key, or "" when there is none.
    title         Page title; defaults to plan.md's "# " title.
    lane          Forge lane (build, quick, ...); the eyebrow reads "Forge plan - <lane> lane".
    repo, date    Meta line; an empty value is left out.
    runDir, sandboxTier, lenses   First rows of the Links table ("Run dir", "Sandbox", "Lenses");
                  an empty value is left out. lenses is a list or a comma string.
    decision      {"approving": str, "size": str, "topRisk": str}. Rendered as the Decision box
                  under the Summary, plus a Tests line from plan.md "## Tests" (its "None: <reason>"
                  line, or the count of its table rows). Missing: stderr warning; the box shows
                  only the Tests line. An empty field is left out.
    status        One line for the status banner; defaults to "Awaiting approval".
    accessRules   List of access-rule sentences. Empty: no Access rules section.
    planReview    {verdict, findings: [{severity, text, disposition}]}. Renders as one closed line,
                  "N findings: F folded, R rejected, O other", that opens to the verdict and table.
                  A disposition starting with "folded" counts as folded, one starting with
                  "rejected" as rejected (case-insensitive); anything else counts as other. No
                  verdict and no findings: no Plan review section.
    pending       [[item, state], ...] or [{item, state}, ...]. Renders closed, below the plan
                  sections. Empty: no Pending section.
    links         [[label, url], ...] or [{label, url}, ...]; each row gets a Copy button.
    next          The exact word the user says to approve the plan, normally "go". The go box asks
                  twice: "Reply <next> to approve the plan" and "Reply tests yes (or confirm the
                  None reason) to approve the tests". Empty: no go box.
  There is no tests key: the Tests section comes from plan.md.

  plan.md supplies everything else:
    "## Summary" renders in the Summary box under the title and is not repeated below. No
    "## Summary": stderr warning, no box. There is no summary data key.
    These headings render first after the Decision box, in this order: "## Out of scope",
    "## Risks" (a table Risk | Mitigation | Undo), "## Alternatives", "## Open questions".
    Headings match case-insensitively; a missing one is left out. No "## Risks": stderr warning,
    and the Decision box shows "Risks: none listed".
    Every other "## " section renders after those in plan.md order with a TOC entry, except
    "## Tests". "## Public API contract" and "## Phases" render closed; a TOC link opens them.
    "## Tests" renders in the fixed Tests section: its table, or its "None: <reason>" line.
    Markdown handled: paragraphs, "- " lists, numbered lists (as a numbered table), "### "
    subheads, pipe tables, fenced code (with a Copy button), `code`, **bold**, and [label](url)
    links. Raw HTML is escaped.

  Shared rules (plan, qa, generic):
    Unknown top-level keys print "render_artifact: warning: unknown key <key> ignored" to stderr;
    the render still exits 0. Relative file paths in the data file resolve against the data
    file's directory.
    Command block: {"command": str, "cwd": str, "note"?: str}. Renders a "Run in: <cwd>" line and
    a monospace block whose Copy button copies the command only (no "$" prompt). note explains
    placeholders such as $FORK. Allowed wherever a key says "command block".
    Copy buttons appear only on links rows, access-card values, users rows, command blocks, and
    fenced code blocks. Inline `code` renders as code with no button.
    Inline text handles `code`, **bold**, and [label](url); only http(s) URLs become links,
    anything else stays escaped text.

  Page order: header, Summary, Decision, status, TOC, plan.md sections, Tests, Access rules,
  Plan review, Pending additions, Links, go box.

  Slots: TITLE, EYEBROW, META_HTML, SUMMARY_HTML, DECISION_HTML, STATUS, TOC, SECTIONS, TESTS_HTML,
  ACCESS_RULES_SECTION, PLAN_REVIEW_SECTION, PENDING_SECTION, LINKS, NEXT. A *_SECTION slot is a whole
  <section id="..." data-toc="Label"> or "".
-->
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #f4f5f2;
  --surface: #ffffff;
  --ink: #1c2321;
  --muted: #5a6560;
  --rule: #dce1dc;
  --accent: #34539c;
  --accent-soft: #e6ebf6;
  --code-bg: #eceee9;
  --warn: #8a5a00;
  --warn-soft: #fbf1dc;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #121614;
    --surface: #1a1f1d;
    --ink: #e2e7e3;
    --muted: #9aa59f;
    --rule: #2c3431;
    --accent: #93acec;
    --accent-soft: #1f2840;
    --code-bg: #232a27;
    --warn: #e8c071;
    --warn-soft: #2e2615;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #121614;
  --surface: #1a1f1d;
  --ink: #e2e7e3;
  --muted: #9aa59f;
  --rule: #2c3431;
  --accent: #93acec;
  --accent-soft: #1f2840;
  --code-bg: #232a27;
  --warn: #e8c071;
  --warn-soft: #2e2615;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.6 var(--sans);
  padding: 0 16px;
}
.wrap { max-width: 980px; margin: 0 auto; padding-block: 32px 64px; display: grid; gap: 28px; min-width: 0; }
.wrap > * { min-width: 0; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font-size: 28px; line-height: 1.2; margin: 0; font-weight: 600; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.pill { display: inline-block; font: 500 11px/1.4 var(--mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; background: var(--code-bg); color: var(--ink); }
.status {
  background: var(--accent-soft); color: var(--ink);
  border-radius: 6px; padding: 10px 14px; font-weight: 500;
}
.status b { color: var(--accent); font-weight: 600; margin-right: 6px; }
h2 { font-size: 19px; font-weight: 600; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); text-wrap: balance; }
h3 { font-size: 16px; font-weight: 600; margin: 0 0 8px; color: var(--accent); text-wrap: balance; }
p { margin: 0 0 12px; max-width: 72ch; }
.muted { color: var(--muted); }
.warn { color: var(--warn); }
code {
  font-family: var(--mono); font-size: .86em; background: var(--code-bg);
  padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere;
}
pre { margin: 0 0 12px; padding: 10px 12px; background: var(--code-bg); border-radius: 6px; overflow-x: auto; }
pre code { padding: 0; background: none; overflow-wrap: normal; white-space: pre; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 12px; }
.tbl:last-child { margin-bottom: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
tbody tr:last-child td { border-bottom: 0; }
th { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--ground); }
td:first-child { font-weight: 500; }
.review td:first-child { width: 14%; }
.review td:last-child { width: 24%; color: var(--muted); }
.pending th { background: var(--warn-soft); color: var(--warn); }
.pending td:last-child { color: var(--warn); width: 34%; }
table.numbered td.num { width: 3em; color: var(--accent); font-family: var(--mono); font-variant-numeric: tabular-nums; }
table.numbered td:last-child { font-weight: 400; }
nav.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
nav.toc a { color: var(--accent); text-decoration: none; }
nav.toc a:hover, nav.toc a:focus-visible { text-decoration: underline; }
section { scroll-margin-top: 16px; min-width: 0; }
ul.rows { list-style: none; margin: 0 0 12px; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; }
ul.rows li { padding: 8px 12px 8px 26px; border-bottom: 1px solid var(--rule); position: relative; }
ul.rows li:last-child { border-bottom: 0; }
ul.rows li::before { content: ""; position: absolute; left: 12px; top: 1.05em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.sub { display: grid; gap: 4px; margin-bottom: 18px; }
.sub:last-child { margin-bottom: 0; }
.links td:first-child { white-space: nowrap; }
.links td:last-child { width: 1%; }
.next { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; padding: 12px 16px; }
a { color: var(--accent); overflow-wrap: anywhere; }
.copy-btn {
  font: 500 12px/1 var(--sans); color: var(--accent); background: transparent;
  border: 1px solid var(--rule); border-radius: 4px; padding: 5px 9px; cursor: pointer; white-space: nowrap;
}
.copy-btn:hover { background: var(--accent-soft); }
.copy-btn[disabled] { opacity: .7; cursor: default; }
.summary { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 12px 16px; }
.summary-label { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.summary > :last-child { margin-bottom: 0; }
.codeblock { position: relative; margin: 0 0 12px; }
.codeblock pre { margin: 0; padding-right: 72px; }
.codeblock .copy-code-btn { position: absolute; top: 6px; right: 6px; margin: 0; background: var(--surface); }
.cmd { display: grid; gap: 4px; margin: 0 0 12px; }
.cmd .codeblock { margin: 0; }
.cmd-cwd, .cmd-note { margin: 0; font-size: 13px; color: var(--muted); }
.decision { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; padding: 12px 16px; }
.decision dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; }
.decision dt { font-weight: 600; }
.decision dd { margin: 0; min-width: 0; }
details.fold > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; cursor: pointer; list-style: none; margin-bottom: 12px; border-bottom: 1px solid var(--rule); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { border-bottom: 0; margin: 0; padding-bottom: 6px; }
details.fold > summary h2::before { content: "\25B8"; display: inline-block; width: 1.1em; color: var(--accent); }
details.fold[open] > summary h2::before { content: "\25BE"; }
.fold-line { color: var(--muted); font-size: 14px; padding-bottom: 6px; }
.go ol { margin: 0; padding-left: 20px; }
.go li + li { margin-top: 4px; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 560px) {
  h1 { font-size: 23px; }
  th, td { padding: 7px 9px; }
  .review td:first-child, .review td:last-child { width: auto; }
  .links td:first-child { white-space: normal; }
  .decision dl { grid-template-columns: minmax(0, 1fr); }
  .decision dd { margin-bottom: 6px; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <div class="meta">{{META_HTML}}</div>
  </header>

  <!--SUMMARY_START-->
  {{SUMMARY_HTML}}
  <!--SUMMARY_END-->

  {{DECISION_HTML}}

  <div class="status" role="status"><b>Status</b>{{STATUS}}</div>

  <nav class="toc" aria-label="Plan sections">{{TOC}}</nav>

  {{SECTIONS}}

  <section id="tests" data-toc="Tests">
    <h2>Tests</h2>
    {{TESTS_HTML}}
  </section>

  {{ACCESS_RULES_SECTION}}

  {{PLAN_REVIEW_SECTION}}

  {{PENDING_SECTION}}

  <section id="links" data-toc="Links">
    <h2>Links</h2>
    <div class="tbl"><table class="links">
      <tbody>{{LINKS}}</tbody>
    </table></div>
  </section>

  {{NEXT}}
</div>

<script>
(function () {
  function copyText(text) {
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (err) { /* clipboard unavailable */ }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(legacy);
    }
    legacy();
    return Promise.resolve();
  }
  document.addEventListener('click', function (event) {
    var btn = event.target.closest ? event.target.closest('.copy-link-btn, .copy-code-btn') : null;
    if (!btn) { return; }
    copyText(btn.getAttribute('data-copy') || '').then(function () {
      var original = btn.textContent;
      btn.textContent = 'Copied';
      btn.disabled = true;
      setTimeout(function () { btn.textContent = original; btn.disabled = false; }, 1500);
    });
  });
  function openFold(id) {
    var target = id ? document.getElementById(id) : null;
    var fold = target ? target.querySelector('details.fold') : null;
    if (fold) { fold.open = true; }
  }
  document.addEventListener('click', function (event) {
    var link = event.target.closest ? event.target.closest('nav.toc a') : null;
    if (link) { openFold(decodeURIComponent(link.getAttribute('href').slice(1))); }
  });
  window.addEventListener('hashchange', function () { openFold(decodeURIComponent(location.hash.slice(1))); });
  openFold(decodeURIComponent(location.hash.slice(1)));
})();
</script>
