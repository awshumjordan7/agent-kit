name: denylist

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DENYLIST: ${{ secrets.DENYLIST }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Scan token shapes
        run: python3 install.py doctor --denylist /dev/null --tokens-only --root .
      - name: Scan private denylist
        if: ${{ env.DENYLIST != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          denylist_file="$(mktemp)"
          printf '%s\n' "$DENYLIST" > "$denylist_file"
          python3 install.py doctor --denylist "$denylist_file" --root .
      - name: Explain unavailable denylist
        if: ${{ env.DENYLIST == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "denylist skipped - secret unavailable on this event"
