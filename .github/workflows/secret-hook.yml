name: secret-hook

on:
  pull_request:
    paths:
      - core/hooks/block_secret_reads.py
      - tests/secret_hook/**
      - .github/workflows/secret-hook.yml
  push:
    branches: [main]
    paths:
      - core/hooks/block_secret_reads.py
      - tests/secret_hook/**
      - .github/workflows/secret-hook.yml

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build fixture repos outside the checkout
        env:
          FIXTURES_ROOT: ${{ runner.temp }}/hook-fixtures
        run: |
          python3 tests/secret_hook/fixtures.py
          # Case R8 needs the nogit fixture outside any git repo.
          if git -C "$FIXTURES_ROOT/nogit" rev-parse --git-dir >/dev/null 2>&1; then
            echo "nogit fixture is inside a git repo"; exit 1
          fi
      - name: Fake HOME with a forge gate config (case E2)
        run: |
          mkdir -p "$RUNNER_TEMP/hook-home/.claude/skills/forge"
          cp tests/secret_hook/forge.config.json "$RUNNER_TEMP/hook-home/.claude/skills/forge/forge.config.json"
      - name: Run the allow/block cases
        env:
          HOME: ${{ runner.temp }}/hook-home
          FIXTURES_ROOT: ${{ runner.temp }}/hook-fixtures
        run: python3 tests/secret_hook/run_cases.py
